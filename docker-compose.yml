services:
  frontend:
    image: ${DOCKERHUB_USERNAME:-1mitsuba}/portfolio-frontend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    restart: unless-stopped
    networks: [portfolio]

  api:
    image: ${DOCKERHUB_USERNAME:-1mitsuba}/portfolio-api:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://portfolio:portfolio@db:5432/portfolio}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost,http://localhost:8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [portfolio]

  caddy:
    image: caddy:2-alpine
    profiles: [production]
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Define SITE_DOMAIN antes del despliegue}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
    networks: [portfolio]

volumes:
  caddy_data:
  caddy_config:

networks:
  portfolio:
